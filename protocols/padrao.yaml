# =============================================================================
# PrivacyScope — protocolo padrao de execucao
#
# Seis variaveis tecnicas: duas por regra deterministica e QUATRO por classificacao
# supervisionada. Cada variavel supervisionada declara o ARTEFATO e o RESUMO
# CRIPTOGRAFICO dele.
#
# O resumo nao e informativo: e CONDICAO DE EXECUCAO. Artefato cuja identidade nao
# confira interrompe a analise, em lugar de produzir resultado atribuido a um modelo
# que nao foi o empregado. Substituir um artefato exige atualizar o resumo aqui.
#
# O canal do titular tem DOIS regimes registrados. Executa-se o supervisionado; o
# detector por regra permanece disponivel como linha de base, mas produz a MESMA
# variavel — declarar ambos exige `variavel_sufixo` em um deles, e o orquestrador
# recusa a duplicidade sem ele.
#
# Nao declara `cookies_set`, `categoria_cookies` nem `menciona_lgpd`: os dois
# primeiros vao para trabalho futuro e o terceiro nao integra a bateria do trabalho.
#
# Uso:
#     privacyscope run protocols/padrao.yaml
# =============================================================================
metadata:
  protocol_version: padrao-v1.0.0
  description: 'Protocolo padrao: 2 variaveis por regra, 4 por classificacao supervisionada'
sources:
# A fonte por ranque nao amostra: devolve os dominios do recorte na ordem do
# ranque, e `max_n` corta os primeiros. Isso DEMONSTRA a camada de ingestao, e nao
# constitui desenho amostral — tomar os 384 .br mais populares e truncamento por
# popularidade, nao sorteio.
#
# O quadro amostral do trabalho e outro e vive congelado em `override_domains` de
# b4, b7 e b9, produzido pelos programas de amostragem, que registram semente e
# criterios. Amostragem e decisao de desenho, e nao leitura de arquivo; embuti-la
# num plugin de entrada esconderia a decisao de quem le o protocolo.
#
# Para executar sobre lista propria, troque por:
#     - name: csv
#       params: {path: minha_lista.csv, sha256: <resumo>}
- name: tranco
  params:
    list_id: 74NJX          # lista imutavel de 2026-06-23; ver protocols/b9.yaml
    top_n: 1000000
    tld_filters: ['.br']
    max_n: 384
repository:
  name: filesystem
  params:
    base_path: data/padrao/
fetcher:
  name: fallback_chain
  params:
    fetchers:
    - name: http_simples
      params:
        respect_robots_txt: true
        max_per_category: 2
        max_total_subpages: 6
        connect_timeout_s: 8
        read_timeout_s: 15
      escalate_if:
      - signal: cookies_pre_consent_zero
      - signal: html_root_smaller_than_bytes
        threshold: 5000
      - signal: subpage_selection_empty
      - signal: has_js_shell_markers
      - exception: JsRequiredError
      - exception: NavigationFailedError
      - exception: FetchError
    - name: playwright
      params:
        headless: true
        phase_screenshots: true
        revoke_after_consent: false
        navigation_timeout_ms: 15000
        scroll_max_iterations: 3
        max_per_category: 2
        max_total_subpages: 6
    max_retries_per_fetcher: 0
    abort_on:
    - exception: RobotsDisallowedError
    # Nome que nao resolve nao melhora com outro coletor: medido em 17/08/2026, o
    # Playwright devolveu ERR_NAME_NOT_RESOLVED nos mesmos cinco casos em que o
    # coletor por requisicao simples ja havia concluido o mesmo. Escalar custava 15
    # segundos por unidade e, pior, substituia NomeNaoResolveError por FetchError
    # generico — o que apagava a distincao entre defeito do quadro amostral e falha
    # de coleta, e impedia o estado `unidade_inexistente` de existir.
    - exception: NomeNaoResolveError
tests:
- name: banner_cookies
  rules_file: config/rules/banner_cookies.yaml
  params: {}
- name: politica_privacidade
  rules_file: config/rules/politica_privacidade.yaml
  params: {}
- name: canal_titular_ml
  params:
    modelo_file: models/canal-titular-v1.0.0.npz
    modelo_sha256: df5f83e297a13eeae39b2e1f1dbd5406444f81410152159c587f50b5aaa37401
- name: finalidade_especificada
  params:
    modelo_file: models/textuais-finalidade-v1.0.0.npz
    modelo_sha256: cf474b9bf6133dc374e0f0720835da6b8e669a67f3008ae4f970a27db96ae0c0
    depende_de:
    - tem_politica_privacidade
- name: direitos_titular_explicados
  params:
    modelo_file: models/textuais-direitos_titular-v1.0.0.npz
    modelo_sha256: a2912290b9911114715a7dd0ea2170bea5e349db39b92b12a6e9c12e84f91a01
    depende_de:
    - tem_politica_privacidade
- name: transf_internacional_divulgada
  params:
    modelo_file: models/textuais-transf_internacional-v1.0.0.npz
    modelo_sha256: ba65b01f76606776b220befc40de2025341f4326ab79e1658bcb3049016c7dff
    depende_de:
    - tem_politica_privacidade
result_store:
  name: sqlite
  params:
    db_path: data/padrao/results.sqlite
outputs:
- name: csv
  params:
    path: data/padrao/resultados.csv
- name: csv_triagem
  params:
    path: data/padrao/resultados_triagem.csv
- name: csv_evidencias
  params:
    path: data/padrao/evidencias.csv
- name: parquet
  params:
    path: data/padrao/resultados.parquet
- name: json
  params:
    path: data/padrao/resultados.json
