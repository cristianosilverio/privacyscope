# =============================================================================
# PrivacyScope — simulacao de uso pelo analista
#
# Reaplica os testes sobre EVIDENCIA JA COLETADA, sem tocar a rede. E o exercicio
# que o art. 28 do proprio desenho preve: "multiplas execucoes analiticas podem ser
# aplicadas sobre o mesmo conjunto preservado".
#
# Difere do protocolo padrao em dois pontos apenas: aponta o repositorio para as
# evidencias de b9, e grava em banco proprio, para nao misturar com os resultados
# ja apurados.
#
# Uso:
#     privacyscope analyze protocols/analista.yaml \
#         --run-id 06c0905b-ea9e-468e-a8b2-bb6399dfeb43
#
# Aquele run reune 506 sitios coletados em 24/06/2026. As tres variaveis
# deterministicas ja constam do banco de b9; esta execucao acrescenta as quatro
# supervisionadas, aplicando os artefatos declarados abaixo.
#
# Cada resultado registra, na trilha de auditoria, o resumo criptografico do
# artefato que o produziu e a versao do preparo de texto — de sorte que a
# reexecucao seja conferivel.
# =============================================================================
metadata:
  protocol_version: analista-v1.0.0
  description: 'Simulacao de uso: reanalise das evidencias ja coletadas em b9'
# SEM `sources`: este protocolo se usa com `privacyscope analyze`, que le a
# evidencia do manifesto do repositorio e nunca resolve a camada de ingestao. O
# bloco de fonte que aqui existia jamais executou, e um protocolo que declara o que
# nao usa induz a erro quem o le.
repository:
  name: filesystem
  params:
    base_path: data/b9/
fetcher:
  name: fallback_chain
  params:
    fetchers:
    - name: http_simples
      params:
        respect_robots_txt: true
        max_per_category: 2
        max_total_subpages: 6
        connect_timeout_s: 8
        read_timeout_s: 15
      escalate_if:
      - signal: cookies_pre_consent_zero
      - signal: html_root_smaller_than_bytes
        threshold: 5000
      - signal: subpage_selection_empty
      - signal: has_js_shell_markers
      - exception: JsRequiredError
      - exception: NavigationFailedError
      - exception: FetchError
    - name: playwright
      params:
        headless: true
        phase_screenshots: true
        revoke_after_consent: false
        navigation_timeout_ms: 15000
        scroll_max_iterations: 3
        max_per_category: 2
        max_total_subpages: 6
    max_retries_per_fetcher: 0
    abort_on:
    - exception: RobotsDisallowedError
tests:
- name: banner_cookies
  rules_file: config/rules/banner_cookies.yaml
  params: {}
- name: politica_privacidade
  rules_file: config/rules/politica_privacidade.yaml
  params: {}
- name: canal_titular_ml
  params:
    modelo_file: models/canal-titular-v1.0.0.npz
    modelo_sha256: df5f83e297a13eeae39b2e1f1dbd5406444f81410152159c587f50b5aaa37401
- name: finalidade_especificada
  params:
    modelo_file: models/textuais-finalidade-v1.0.0.npz
    modelo_sha256: cf474b9bf6133dc374e0f0720835da6b8e669a67f3008ae4f970a27db96ae0c0
    depende_de:
    - tem_politica_privacidade
- name: direitos_titular_explicados
  params:
    modelo_file: models/textuais-direitos_titular-v1.0.0.npz
    modelo_sha256: a2912290b9911114715a7dd0ea2170bea5e349db39b92b12a6e9c12e84f91a01
    depende_de:
    - tem_politica_privacidade
- name: transf_internacional_divulgada
  params:
    modelo_file: models/textuais-transf_internacional-v1.0.0.npz
    modelo_sha256: ba65b01f76606776b220befc40de2025341f4326ab79e1658bcb3049016c7dff
    depende_de:
    - tem_politica_privacidade
result_store:
  name: sqlite
  params:
    db_path: data/simulacao/analista.sqlite
outputs:
- name: csv
  params:
    path: data/simulacao/resultados.csv
- name: csv_largo
  params:
    path: data/simulacao/resultados_largo.csv
- name: csv_evidencias
  params:
    path: data/simulacao/evidencias.csv
- name: parquet
  params:
    path: data/simulacao/resultados.parquet
- name: json
  params:
    path: data/simulacao/resultados.json
