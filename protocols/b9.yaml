# 20260623, 500 empresariais + 150 governamentais; alvo efetivo 384 corp +
# 77 gov apos atrito). Sobre-representacao deliberada do estrato governamental.
#
# Endurecimento (no codigo, ativo automaticamente):
#   A) politica em PDF: download + extracao (pymupdf) com OCR de reserva.
#   B) espera por conteudo no Playwright (SPA que renderiza a politica tarde).
#   C) lexico de descoberta de subpaginas ampliado (link 'Politicas').
#   D) contexto realista (locale pt-BR, UA) + espera de conteudo cobrem desafios.
#
# Detectores deterministicos: banner v0.3.1, politica v0.2.1, canal v0.2.2.
# PDFs ficam na evidencia (custodia por hash); re-analise com texto de PDF pode
# ser aplicada depois sem recoletar (evidence store append-only).
# =============================================================================

