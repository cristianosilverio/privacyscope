# =============================================================================
# EXERCICIO DA FONTE `csv` — NAO E AMOSTRA DO TRABALHO
#
# Dez dominios .br da mesma lista Tranco N2KLW empregada na validacao do caminho de
# coleta, sorteados com semente propria e com os cem daquela coleta EXCLUIDOS. A
# exclusao nao e detalhe: reamostrar sobre unidades ja observadas produziria
# conjuntos sobrepostos, e diferenca entre eles se confundiria com repeticao.
#
# O que se exercita aqui e a via de entrada, e nao o desenho amostral. A fonte `csv`
# le a lista de quem executa; quem decide o que entra na lista e o programa de
# amostragem, que produz registro proprio. O campo `sha256` amarra a lista lida a
# lista declarada: divergencia INTERROMPE, em lugar de executar sobre outro quadro.
#
# O resumo e gravado por scripts/declarar_lista.py APOS a geracao do CSV. Enquanto
# nao gravado, permanece o marcador PENDENTE e o protocolo recusa execucao.
#
# Uso:
#   python scripts/amostrar_ao_vivo.py --list-id N2KLW --n 10 --semente 20260815 \
#       --excluir protocols/aovivo_amostra.csv --so-lista \
#       --amostra protocols/exercicio_lista.csv
#   python scripts/declarar_lista.py protocols/exercicio_csv.yaml
#   privacyscope run protocols/exercicio_csv.yaml
# =============================================================================
metadata:
  protocol_version: exercicio-csv-N2KLW-v1.0.0
  description: 'Exercicio da fonte `csv`: 10 dominios .br da lista Tranco N2KLW, semente
    20260815, disjuntos da coleta ao vivo. NAO integra a amostra do trabalho.'
sources:
- name: csv
  params:
    path: protocols/exercicio_lista.csv
    coluna_dominio: url
    sha256: ef9363f19e46f117ffe7d28fefe9ac5cf8ed9da8fbb909cf069b3a48f6840a88
    max_n: 10
repository:
  name: filesystem
  params:
    base_path: data/exercicio_csv/
fetcher:
  name: fallback_chain
  params:
    fetchers:
    - name: http_simples
      params:
        respect_robots_txt: true
        max_per_category: 2
        max_total_subpages: 6
        connect_timeout_s: 8
        read_timeout_s: 15
      escalate_if:
      - signal: cookies_pre_consent_zero
      - signal: html_root_smaller_than_bytes
        threshold: 5000
      - signal: subpage_selection_empty
      - signal: has_js_shell_markers
      - exception: JsRequiredError
      - exception: NavigationFailedError
      - exception: FetchError
    - name: playwright
      params:
        headless: true
        phase_screenshots: true
        revoke_after_consent: false
        navigation_timeout_ms: 15000
        scroll_max_iterations: 3
        max_per_category: 2
        max_total_subpages: 6
    max_retries_per_fetcher: 0
    abort_on:
    - exception: RobotsDisallowedError
tests:
- name: banner_cookies
  rules_file: config/rules/banner_cookies.yaml
  params: {}
- name: politica_privacidade
  rules_file: config/rules/politica_privacidade.yaml
  params: {}
- name: canal_titular_ml
  params:
    modelo_file: models/canal-titular-v1.0.0.npz
    modelo_sha256: df5f83e297a13eeae39b2e1f1dbd5406444f81410152159c587f50b5aaa37401
- name: finalidade_especificada
  params:
    modelo_file: models/textuais-finalidade-v1.0.0.npz
    modelo_sha256: cf474b9bf6133dc374e0f0720835da6b8e669a67f3008ae4f970a27db96ae0c0
    depende_de:
    - tem_politica_privacidade
- name: direitos_titular_explicados
  params:
    modelo_file: models/textuais-direitos_titular-v1.0.0.npz
    modelo_sha256: a2912290b9911114715a7dd0ea2170bea5e349db39b92b12a6e9c12e84f91a01
    depende_de:
    - tem_politica_privacidade
- name: transf_internacional_divulgada
  params:
    modelo_file: models/textuais-transf_internacional-v1.0.0.npz
    modelo_sha256: ba65b01f76606776b220befc40de2025341f4326ab79e1658bcb3049016c7dff
    depende_de:
    - tem_politica_privacidade
result_store:
  name: sqlite
  params:
    db_path: data/exercicio_csv/results.sqlite
outputs:
- name: csv
  params:
    path: data/exercicio_csv/resultados.csv
- name: csv_largo
  params:
    path: data/exercicio_csv/resultados_largo.csv
- name: csv_evidencias
  params:
    path: data/exercicio_csv/evidencias.csv
- name: parquet
  params:
    path: data/exercicio_csv/resultados.parquet
- name: json
  params:
    path: data/exercicio_csv/resultados.json
